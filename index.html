<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Lo-Fi Wireframe - Chest Tube Insertion (10-Step Simulator UI)</title>
  <!-- Load Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* =========================================================================
       LO-FI WIREFRAME DESIGN TOKENS & ERGONOMIC TOUCH STYLES
       ========================================================================= */
    :root {
      --paper: #f6f6f2;
      --paper-alt: #eaeae4;
      --ink: #111111;
      --ink-muted: #4a4a46;
      --border-heavy: 2px solid #111111;
      --border-thick: 3px solid #111111;
      --shadow-hard: 4px 4px 0px #111111;
      --shadow-hard-sm: 2px 2px 0px #111111;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background-color: #262624;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    .font-mono-wire {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    /* Wireframe Hatched Patterns for Lo-Fi Visual Hierarchy */
    .bg-hatched {
      background-image: repeating-linear-gradient(-45deg,
          #e5e5df,
          #e5e5df 6px,
          #f6f6f2 6px,
          #f6f6f2 12px);
    }

    .bg-hatched-dark {
      background-image: repeating-linear-gradient(-45deg,
          #111111,
          #111111 6px,
          #2b2b28 6px,
          #2b2b28 12px);
    }

    .bg-dots {
      background-image: radial-gradient(#b5b5ad 1px, transparent 1px);
      background-size: 12px 12px;
    }

    /* Wireframe Cards & Buttons */
    .wire-box {
      background-color: var(--paper);
      border: var(--border-heavy);
      box-shadow: var(--shadow-hard);
    }

    .wire-box-flat {
      background-color: var(--paper);
      border: var(--border-heavy);
    }

    .wire-dashed {
      background-color: #eeeee8;
      border: 2px dashed #111111;
    }

    /* Oversized Ergonomic Touch Button (Min Height 68px for Gloved / Arm's-Length Reach) */
    .wire-btn {
      min-height: 68px;
      border: var(--border-heavy);
      box-shadow: var(--shadow-hard);
      background-color: var(--paper);
      color: var(--ink);
      font-weight: 700;
      transition: transform 0.06s ease, box-shadow 0.06s ease, background-color 0.06s ease, color 0.06s ease;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: left;
      touch-action: manipulation;
    }

    .wire-btn:hover {
      background-color: #ecece6;
    }

    .wire-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0px #111111;
      background-color: #111111 !important;
      color: #f6f6f2 !important;
    }

    .wire-btn-primary {
      background-color: #111111;
      color: #f6f6f2;
    }

    .wire-btn-primary:hover {
      background-color: #292926;
    }

    .wire-btn-primary:active {
      background-color: #f6f6f2 !important;
      color: #111111 !important;
    }

    /* Compact Header Button */
    .wire-btn-sm {
      min-height: 44px;
      border: var(--border-heavy);
      box-shadow: var(--shadow-hard-sm);
      background-color: var(--paper);
      color: var(--ink);
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.06s ease, box-shadow 0.06s ease;
      touch-action: manipulation;
    }

    .wire-btn-sm:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #111111;
      background-color: #111111;
      color: #f6f6f2;
    }

    /* Custom Lo-Fi Range Scrubber for Video Player */
    input[type="range"].wire-scrubber {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 16px;
      background: #e2e2dc;
      border: 2px solid #111111;
      outline: none;
      cursor: pointer;
    }

    input[type="range"].wire-scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 32px;
      height: 36px;
      background: #111111;
      border: 2px solid #f6f6f2;
      box-shadow: 2px 2px 0px #111111;
      cursor: pointer;
    }

    /* Responsive iPad Frame Modes */
    /* Mode 1: Framed 1024x768 iPad Bezel on wide desktop monitors */
    .viewport-bezel-mode {
      width: 1024px;
      height: 768px;
      max-width: 100vw;
      max-height: calc(100dvh - 52px);
      border: 14px solid #141413;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 0 2px #444440;
      overflow: hidden;
      position: relative;
      background-color: var(--paper);
    }

    /* Mode 2: Full Viewport Mode (Auto-activated on <=1180px or Chrome DevTools iPad Emulation) */
    .viewport-fill-mode {
      width: 100vw;
      height: calc(100dvh - 44px);
      border: none;
      border-radius: 0;
      overflow: hidden;
      position: relative;
      background-color: var(--paper);
    }

    .viewport-fill-mode.devtools-hidden-bar {
      height: 100dvh;
    }

    /* Automatically switch to full-bleed when testing inside Chrome DevTools iPad Portrait/Landscape (<=1180px) */
    @media (max-width: 1180px) {
      .viewport-bezel-mode {
        width: 100vw !important;
        height: calc(100dvh - 44px) !important;
        max-height: none !important;
        border: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
      }

      .viewport-bezel-mode.devtools-hidden-bar {
        height: 100dvh !important;
      }
    }

    /* Scrollbar styling inside wireframe panels */
    .wire-scroll::-webkit-scrollbar {
      width: 8px;
    }

    .wire-scroll::-webkit-scrollbar-track {
      background: #e5e5df;
      border-left: 2px solid #111;
    }

    .wire-scroll::-webkit-scrollbar-thumb {
      background: #111;
    }
  </style>
</head>

<body class="flex flex-col items-center justify-start min-h-[100dvh]">

  <!-- =========================================================================
       RESEARCHER UTILITY & CHROME DEVTOOLS BAR (Collapsible for pure iPad view)
       ========================================================================= -->
  <div id="researcherBar"
    class="w-full bg-[#181816] text-[#f6f6f2] border-b-2 border-[#3c3c38] px-3 py-1.5 flex flex-wrap items-center justify-between gap-2 text-xs font-mono-wire z-50">
    <div class="flex items-center gap-2 flex-wrap">
      <span class="bg-[#f6f6f2] text-[#111] font-bold px-2 py-0.5 rounded-sm uppercase tracking-wider">XR Lo-Fi
        Testbed</span>

      <!-- Bezel / Viewport Toggle -->
      <button id="btnToggleFrame" onclick="toggleFrameMode()"
        class="px-2.5 py-1 bg-[#2c2c29] hover:bg-[#3c3c38] border border-[#666] rounded-sm font-bold transition">
        [Frame: 1024×768 iPad Bezel]
      </button>

      <!-- Step Quick-Jumper for Researcher Testing -->
      <label class="flex items-center gap-1 bg-[#2c2c29] border border-[#666] px-2 py-0.5 rounded-sm">
        <span class="text-[#aaa]">Jump:</span>
        <select id="stepJumpSelect" onchange="researcherJumpToStep(this.value)"
          class="bg-transparent text-[#f6f6f2] font-bold focus:outline-none cursor-pointer">
          <!-- Populated dynamically -->
        </select>
      </label>

      <!-- Reset Current Step / Session -->
      <button onclick="resetEntireSession()"
        class="px-2 py-1 bg-[#2c2c29] hover:bg-[#3c3c38] border border-[#666] rounded-sm text-[#ddd]"
        title="Reset all step verifications">
        [RESET SESSION]
      </button>
    </div>

    <!-- Right: Live Telemetry Ticker & CSV Export -->
    <div class="flex items-center gap-2 flex-wrap">
      <div id="telemetryTicker"
        class="hidden md:flex items-center gap-1.5 bg-[#111] border border-[#444] px-2.5 py-1 rounded-sm text-[11px] text-[#bbb] max-w-[320px] truncate">
        <span class="inline-block w-2 h-2 rounded-full bg-white animate-pulse"></span>
        <span id="telemetryLastEvent">LOG READY (0 events)</span>
      </div>

      <button onclick="exportTelemetryCSV()"
        class="px-2.5 py-1 bg-[#f6f6f2] text-[#111] font-bold border border-white rounded-sm hover:bg-[#ddd] transition">
        [EXPORT CSV] (<span id="telemetryCount">0</span>)
      </button>

      <button onclick="openTelemetryModal()"
        class="px-2 py-1 bg-[#2c2c29] hover:bg-[#3c3c38] border border-[#666] rounded-sm">
        [VIEW LOG]
      </button>

      <button onclick="toggleResearcherBar(false)"
        class="px-2 py-1 bg-[#2c2c29] hover:bg-[#3c3c38] border border-[#666] rounded-sm text-[#aaa]"
        title="Hide utility bar for full-bleed DevTools screenshot">
        [Hide Bar]
      </button>
    </div>
  </div>

  <!-- Floating Mini Pill to Restore Researcher Bar when hidden -->
  <button id="btnRestoreResearcherBar" onclick="toggleResearcherBar(true)"
    class="hidden fixed top-1 right-2 z-50 bg-[#111] text-[#f6f6f2] border border-[#777] px-2 py-0.5 text-[10px] font-mono-wire rounded opacity-75 hover:opacity-100">
    [+ Researcher Bar]
  </button>

  <!-- =========================================================================
       IPAD LANDSCAPE VIEWPORT CONTAINER (1024x768 Default / 100dvh Responsive)
       ========================================================================= -->
  <div id="ipadScreenContainer" class="flex-1 w-full flex items-center justify-center p-0 lg:p-2">
    <main id="ipadViewport" class="viewport-bezel-mode flex flex-col justify-between bg-dots">

      <!-- =====================================================================
           PERSISTENT TOP SPATIAL UI HEADER (Step Progress, Status Pill, Text Toggle)
           ===================================================================== -->
      <header class="w-full bg-[#f6f6f2] border-b-[3px] border-[#111111] px-4 py-2.5 flex flex-col gap-2 shrink-0 z-20">
        <div class="flex items-center justify-between gap-3">
          <!-- Left: Step Number & Title -->
          <div class="flex items-center gap-2.5 min-w-0">
            <span id="headerStepBadge"
              class="bg-[#111111] text-[#f6f6f2] font-mono-wire font-bold text-sm md:text-base px-2.5 py-1 shrink-0 border-2 border-[#111]">
              STEP 1 / 10
            </span>
            <h1 id="headerStepTitle" class="text-lg md:text-xl font-extrabold uppercase tracking-tight truncate">
              Select & Prepare Drainage Tube
            </h1>
          </div>

          <!-- Right: State Pill + Persistent Text Density Toggle -->
          <div class="flex items-center gap-2 shrink-0">
            <span id="headerStatePill"
              class="hidden sm:inline-block font-mono-wire text-xs font-bold uppercase px-2.5 py-1 border-2 border-[#111] bg-hatched">
              STATE A: BRIEFING / EXECUTION
            </span>

            <button id="btnTextModeToggle" onclick="toggleTextDensity()"
              class="wire-btn-sm px-3 py-1.5 text-xs md:text-sm font-mono-wire flex items-center gap-1.5"
              title="Toggle persistent text mode between compact and full">
              <span>TEXT MODE:</span>
              <span id="labelTextMode" class="underline font-extrabold">COMPACT</span>
            </button>
          </div>
        </div>

        <!-- 10-Segment Step Progress Bar with Verification Indicators -->
        <div id="stepProgressBar" class="grid grid-cols-10 gap-1.5 w-full pt-0.5">
          <!-- Populated dynamically by JS -->
        </div>
      </header>

      <!-- =====================================================================
           MAIN DYNAMIC VIEWPORT BODY (Renders State A, B, C, D, or Summary)
           ===================================================================== -->
      <section id="mainStage"
        class="flex-1 w-full overflow-y-auto wire-scroll p-4 md:p-5 flex flex-col justify-between relative">
        <!-- Populated dynamically by renderCurrentState() -->
      </section>

      <!-- =====================================================================
           PERSISTENT BOTTOM ERGONOMIC ACTION BAR (Min-Height 72px Touch Targets)
           ===================================================================== -->
      <footer id="bottomActionBar" class="w-full bg-[#eaeae4] border-t-[3px] border-[#111111] px-4 py-3 shrink-0 z-20">
        <!-- Populated dynamically by renderCurrentState() -->
      </footer>

    </main>
  </div>

  <!-- =========================================================================
       TELEMETRY LOG MODAL (For Inspecting / Copying CSV Without Downloading)
       ========================================================================= -->
  <div id="telemetryModal" class="hidden fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4">
    <div class="wire-box w-full max-w-3xl max-h-[85vh] flex flex-col bg-[#f6f6f2] p-5 gap-4">
      <div class="flex items-center justify-between border-b-2 border-[#111] pb-3">
        <div>
          <h2 class="text-lg font-extrabold uppercase font-mono-wire">Session Telemetry Log (CSV Format)</h2>
          <p class="text-xs text-[#4a4a46] font-mono-wire">Tracks task-switching, video playback controls, text toggles,
            quiz attempts, and remediation loops.</p>
        </div>
        <button onclick="closeTelemetryModal()" class="wire-btn-sm px-3 py-1 font-mono-wire text-sm">[CLOSE]</button>
      </div>

      <textarea id="telemetryCsvTextarea" readonly
        class="w-full flex-1 min-h-[260px] p-3 font-mono-wire text-xs bg-white border-2 border-[#111] focus:outline-none select-all"
        style="user-select: text; -webkit-user-select: text;"></textarea>

      <div class="flex items-center justify-between gap-3">
        <span id="copyFeedbackMsg" class="text-xs font-mono-wire font-bold text-[#111]">Ready to copy or
          download.</span>
        <div class="flex items-center gap-3">
          <button onclick="copyTelemetryToClipboard()" class="wire-btn-sm px-4 py-2 font-mono-wire text-xs">[COPY CSV TO
            CLIPBOARD]</button>
          <button onclick="exportTelemetryCSV()"
            class="wire-btn-sm px-4 py-2 font-mono-wire text-xs bg-[#111] text-white">[DOWNLOAD CSV FILE]</button>
        </div>
      </div>
    </div>
  </div>

  <!-- =========================================================================
       APPLICATION DATA & STATE MACHINE LOGIC
       ========================================================================= -->

    /* =========================================================================
       2. APPLICATION STATE & TELEMETRY STORE
       ========================================================================= */
    const appState = {
      currentStepIndex: 0,          // 0..9
      currentState: "A",            // "A" (Prompt), "B" (Video), "C" (Quiz), "D" (Remediation), "DONE" (Session Summary)
      currentQuestionIndex: 0,      // 0 or 1 within current step
      textMode: "COMPACT",          // Persistent user preference from top-right toggle: "FULL" or "COMPACT"
      temporaryFullStepIndex: null,  // Step index with temporary full-text expansion from compact checklist tap
      frameMode: "BEZEL",           // "BEZEL" (1024x768) or "FILL"
      // Track verification status per question ID: 'PENDING' | 'VERIFIED' | 'FAILED'
      questionStatus: {},
      // Store shuffled options per question ID so they stay consistent while viewing a question, and reshuffle on retry
      shuffledOptionsMap: {},
      // Store last failed option details for State D
      lastErrorRecord: null,
      // Simulated Video Player State
      video: {
        isPlaying: false,
        currentTime: 0,
        duration: 15.0,
        rafId: null,
        lastTick: null
      },
      // Telemetry log array
      telemetry: [],
      sessionStartTime: Date.now()
    };

    /* Initialize Question Statuses */
    function initVerificationState() {
      STEPS_DATA.forEach(step => {
        step.questions.forEach(q => {
          appState.questionStatus[q.id] = "PENDING";
          shuffleOptionsForQuestion(q);
        });
      });
    }

    /* Fisher-Yates Shuffle for Quiz Options */
    function shuffleOptionsForQuestion(questionObj) {
      const cloned = questionObj.options.map((opt, idx) => ({ ...opt, origIndex: idx }));
      for (let i = cloned.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
      }
      appState.shuffledOptionsMap[questionObj.id] = cloned;
    }

    /* Check if all sub-questions in a given step index are VERIFIED */
    function isStepFullyVerified(stepIdx) {
      const step = STEPS_DATA[stepIdx];
      return step.questions.every(q => appState.questionStatus[q.id] === "VERIFIED");
    }

    /* Find first unverified question index in current step (or 0 if all verified) */
    function getFirstUnverifiedQuestionIndex(stepIdx) {
      const step = STEPS_DATA[stepIdx];
      const idx = step.questions.findIndex(q => appState.questionStatus[q.id] !== "VERIFIED");
      return idx === -1 ? 0 : idx;
    }

    /* =========================================================================
       3. TELEMETRY LOGGING ENGINE
       ========================================================================= */
    function logEvent(eventType, details = "") {
      const now = Date.now();
      const elapsedSec = ((now - appState.sessionStartTime) / 1000).toFixed(2);
      const isoTime = new Date(now).toISOString();
      const stepNum = STEPS_DATA[appState.currentStepIndex]?.stepNumber || "DONE";
      const qId = STEPS_DATA[appState.currentStepIndex]?.questions[appState.currentQuestionIndex]?.id || "-";

      const entry = {
        index: appState.telemetry.length + 1,
        timestampISO: isoTime,
        elapsedSeconds: elapsedSec,
        step: stepNum,
        state: appState.currentState,
        questionId: qId,
        textMode: appState.textMode,
        eventType: eventType,
        details: String(details).replace(/"/g, "'")
      };

      appState.telemetry.push(entry);

      // Update Researcher Bar Ticker
      const countEl = document.getElementById("telemetryCount");
      const lastEl = document.getElementById("telemetryLastEvent");
      if (countEl) countEl.textContent = appState.telemetry.length;
      if (lastEl) lastEl.textContent = `[+${elapsedSec}s] S${stepNum}/${appState.currentState}: ${eventType}`;
    }

    function generateCSVString() {
      const headers = ["Event_Index", "Timestamp_ISO", "Elapsed_Sec", "Step", "UI_State", "Question_ID", "Text_Density_Mode", "Event_Type", "Details"];
      const rows = appState.telemetry.map(e => [
        e.index,
        `"${e.timestampISO}"`,
        e.elapsedSeconds,
        e.step,
        `"${e.state}"`,
        `"${e.questionId}"`,
        `"${e.textMode}"`,
        `"${e.eventType}"`,
        `"${e.details}"`
      ].join(","));
      return [headers.join(","), ...rows].join("\n");
    }

    function exportTelemetryCSV() {
      logEvent("EXPORT_CSV", `Exported ${appState.telemetry.length} events`);
      const csvContent = generateCSVString();
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `bulau_xr_wireframe_telemetry_${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function openTelemetryModal() {
      logEvent("OPEN_TELEMETRY_MODAL", "Researcher viewed telemetry log");
      const textarea = document.getElementById("telemetryCsvTextarea");
      textarea.value = generateCSVString();
      document.getElementById("telemetryModal").classList.remove("hidden");
    }

    function closeTelemetryModal() {
      document.getElementById("telemetryModal").classList.add("hidden");
    }

    function copyTelemetryToClipboard() {
      const textarea = document.getElementById("telemetryCsvTextarea");
      textarea.select();
      document.execCommand("copy");
      const msg = document.getElementById("copyFeedbackMsg");
      msg.textContent = "Copied CSV to clipboard.";
      setTimeout(() => { msg.textContent = "Ready to copy or download."; }, 2500);
    }

    /* =========================================================================
       4. RESEARCHER UTILITY BAR CONTROLS
       ========================================================================= */
    function populateResearcherDropdown() {
      const select = document.getElementById("stepJumpSelect");
      select.innerHTML = STEPS_DATA.map((s, idx) =>
        `<option value="${idx}">Step ${s.stepNumber}: ${s.shortTitle}</option>`
      ).join("");
    }

    function researcherJumpToStep(stepIdxStr) {
      stopVideoLoop();
      const idx = parseInt(stepIdxStr, 10);
      appState.currentStepIndex = idx;
      appState.currentState = "A";
      appState.temporaryFullStepIndex = null;
      appState.currentQuestionIndex = getFirstUnverifiedQuestionIndex(idx);
      logEvent("RESEARCHER_JUMP_STEP", `Jumped to Step ${idx + 1}`);
      renderCurrentState();
    }

    function toggleFrameMode() {
      const vp = document.getElementById("ipadViewport");
      const btn = document.getElementById("btnToggleFrame");
      const container = document.getElementById("ipadScreenContainer");

      if (appState.frameMode === "BEZEL") {
        appState.frameMode = "FILL";
        vp.classList.remove("viewport-bezel-mode");
        vp.classList.add("viewport-fill-mode");
        container.classList.remove("lg:p-2");
        btn.textContent = "[Frame: Fill Browser Viewport]";
      } else {
        appState.frameMode = "BEZEL";
        vp.classList.remove("viewport-fill-mode");
        vp.classList.add("viewport-bezel-mode");
        container.classList.add("lg:p-2");
        btn.textContent = "[Frame: 1024×768 iPad Bezel]";
      }
      logEvent("TOGGLE_FRAME_MODE", `Frame mode set to ${appState.frameMode}`);
    }

    function toggleResearcherBar(show) {
      const bar = document.getElementById("researcherBar");
      const restoreBtn = document.getElementById("btnRestoreResearcherBar");
      const vp = document.getElementById("ipadViewport");
      if (show) {
        bar.classList.remove("hidden");
        restoreBtn.classList.add("hidden");
        vp.classList.remove("devtools-hidden-bar");
      } else {
        bar.classList.add("hidden");
        restoreBtn.classList.remove("hidden");
        vp.classList.add("devtools-hidden-bar");
      }
    }

    function resetEntireSession() {
      stopVideoLoop();
      appState.currentStepIndex = 0;
      appState.currentState = "A";
      appState.currentQuestionIndex = 0;
      appState.lastErrorRecord = null;
      appState.temporaryFullStepIndex = null;
      initVerificationState();
      logEvent("SESSION_RESET", "Reset all steps to PENDING and returned to Step 1");
      renderCurrentState();
    }

    function toggleTextDensity() {
      appState.textMode = appState.textMode === "FULL" ? "COMPACT" : "FULL";
      if (appState.textMode === "FULL") {
        appState.temporaryFullStepIndex = null;
      }
      document.getElementById("labelTextMode").textContent = appState.textMode;
      logEvent("TOGGLE_TEXT_DENSITY", `Switched instruction density to ${appState.textMode}`);
      renderCurrentState();
    }

    function isFullTextVisibleForCurrentStep() {
      return appState.textMode === "FULL" || appState.temporaryFullStepIndex === appState.currentStepIndex;
    }

    function expandCompactToFullForCurrentStep() {
      if (appState.textMode === "FULL") return;
      appState.temporaryFullStepIndex = appState.currentStepIndex;
      logEvent("TEMP_EXPAND_FULL_TEXT", `Temporarily expanded Step ${appState.currentStepIndex + 1} from compact to full text`);
      renderCurrentState();
    }

    function collapseFullToCompactForCurrentStep() {
      if (appState.textMode === "FULL") {
        appState.textMode = "COMPACT";
        document.getElementById("labelTextMode").textContent = appState.textMode;
      }
      appState.temporaryFullStepIndex = null;
      logEvent("TEMP_COLLAPSE_TO_COMPACT", `Collapsed Step ${appState.currentStepIndex + 1} full text to compact list`);
      renderCurrentState();
    }

    /* =========================================================================
       5. STATE MACHINE NAVIGATION HANDLERS
       ========================================================================= */
    function goToStateA() {
      stopVideoLoop();
      appState.currentState = "A";
      logEvent("NAV_STATE_A", `Viewing Action Prompt (Step ${appState.currentStepIndex + 1})`);
      renderCurrentState();
    }

    function goToStateB() {
      appState.currentState = "B";
      appState.video.currentTime = 0;
      appState.video.isPlaying = true;
      logEvent("NAV_STATE_B_VIDEO", `Opened Demo Video for Step ${appState.currentStepIndex + 1}`);
      renderCurrentState();
      startVideoLoop();
    }

    function goToStateC(questionIdx = null) {
      stopVideoLoop();
      appState.currentState = "C";
      if (questionIdx !== null) {
        appState.currentQuestionIndex = questionIdx;
      } else {
        appState.currentQuestionIndex = getFirstUnverifiedQuestionIndex(appState.currentStepIndex);
      }
      const qObj = STEPS_DATA[appState.currentStepIndex].questions[appState.currentQuestionIndex];
      logEvent("NAV_STATE_C_QUIZ", `Opened Self-Check ${qObj.id}`);
      renderCurrentState();
    }

    function handleQuizOptionSelect(optionIndex) {
      const step = STEPS_DATA[appState.currentStepIndex];
      const qObj = step.questions[appState.currentQuestionIndex];
      const shuffledOpts = appState.shuffledOptionsMap[qObj.id];
      const chosenOpt = shuffledOpts[optionIndex];

      if (chosenOpt.isOptimal) {
        appState.questionStatus[qObj.id] = "VERIFIED";
        logEvent("QUIZ_PASS_OPTIMAL", `${qObj.id} Verified Optimal: ${chosenOpt.text.substring(0, 48)}...`);
        renderCurrentState();
      } else {
        appState.questionStatus[qObj.id] = "FAILED";
        appState.lastErrorRecord = {
          questionId: qObj.id,
          questionLabel: qObj.label,
          selectedText: chosenOpt.text,
          errorCategory: chosenOpt.category,
          gateBadge: qObj.gateBadge,
          riskText: qObj.riskText,
          fixText: qObj.fixText,
          rollbackTarget: step.rollbackTarget
        };
        appState.currentState = "D";
        logEvent("QUIZ_FAIL_REMEDIATION", `${qObj.id} Deviation [${chosenOpt.category}]: ${chosenOpt.text.substring(0, 48)}...`);
        renderCurrentState();
      }
    }

    function retryFailedQuestion() {
      const step = STEPS_DATA[appState.currentStepIndex];
      const qObj = step.questions[appState.currentQuestionIndex];
      // Reshuffle options so the trainee must actively read the physical states again
      shuffleOptionsForQuestion(qObj);
      appState.currentState = "C";
      logEvent("REMEDIATION_RETRY_QUIZ", `Fixed on trainer & retrying ${qObj.id}`);
      renderCurrentState();
    }

    function executeRollbackToStep(targetStepNumber) {
      stopVideoLoop();
      const targetIdx = targetStepNumber - 1;
      // Reset verification status from targetIdx up to currentStepIndex so trainee re-verifies the tract
      for (let i = targetIdx; i <= appState.currentStepIndex; i++) {
        STEPS_DATA[i].questions.forEach(q => {
          appState.questionStatus[q.id] = "PENDING";
          shuffleOptionsForQuestion(q);
        });
      }
      appState.currentStepIndex = targetIdx;
      appState.currentQuestionIndex = 0;
      appState.currentState = "A";
      appState.temporaryFullStepIndex = null;
      logEvent("SIMULATOR_TRACT_ROLLBACK", `Rolled back to Step ${targetStepNumber} to re-establish pleural tract`);
      renderCurrentState();
    }

    function advanceToNextStep() {
      stopVideoLoop();
      if (!isStepFullyVerified(appState.currentStepIndex)) {
        // Hard gate fallback: route to the unverified question
        const unverifiedIdx = getFirstUnverifiedQuestionIndex(appState.currentStepIndex);
        goToStateC(unverifiedIdx);
        return;
      }

      if (appState.currentStepIndex < STEPS_DATA.length - 1) {
        appState.currentStepIndex++;
        appState.currentQuestionIndex = 0;
        appState.currentState = "A";
        if (appState.textMode === "COMPACT") {
          appState.temporaryFullStepIndex = null;
        }
        logEvent("ADVANCE_NEXT_STEP", `Advanced to Step ${appState.currentStepIndex + 1}`);
        renderCurrentState();
      } else {
        appState.currentState = "DONE";
        logEvent("PROCEDURE_COMPLETE", "All 10 steps verified optimal");
        renderCurrentState();
      }
    }

    /* =========================================================================
       6. HEADER & PROGRESS BAR RENDERER
       ========================================================================= */
    function renderHeaderAndProgress() {
      const step = STEPS_DATA[appState.currentStepIndex];
      document.getElementById("stepJumpSelect").value = String(appState.currentStepIndex);

      if (appState.currentState === "DONE") {
        document.getElementById("headerStepBadge").textContent = "COMPLETED";
        document.getElementById("headerStepTitle").textContent = "All 10 Core Chest Tube Steps Verified";
        document.getElementById("headerStatePill").textContent = "SESSION SUMMARY";
      } else {
        document.getElementById("headerStepBadge").textContent = `STEP ${step.stepNumber} / 10`;
        document.getElementById("headerStepTitle").textContent = step.shortTitle;

        const stateLabels = {
          "A": "STATE A: BRIEFING / EXECUTION",
          "B": "STATE B: VIDEO DEMO OVERLAY",
          "C": `STATE C: SELF-CHECK (${step.questions[appState.currentQuestionIndex].id})`,
          "D": `STATE D: REMEDIATION GATE (${step.questions[appState.currentQuestionIndex].id})`
        };
        document.getElementById("headerStatePill").textContent = stateLabels[appState.currentState] || "";
      }

      // Render 10-segment progress bar
      const barContainer = document.getElementById("stepProgressBar");
      barContainer.innerHTML = STEPS_DATA.map((s, idx) => {
        const verified = isStepFullyVerified(idx);
        const hasFail = s.questions.some(q => appState.questionStatus[q.id] === "FAILED");
        const isCurrent = idx === appState.currentStepIndex && appState.currentState !== "DONE";

        let bgClass = "bg-white text-[#111]";
        let statusSymbol = "";
        if (verified) {
          bgClass = "bg-[#111111] text-[#f6f6f2]";
          statusSymbol = "OK";
        } else if (hasFail) {
          bgClass = "bg-hatched text-[#111] font-extrabold";
          statusSymbol = "!";
        }

        const ringClass = isCurrent ? "ring-2 ring-offset-1 ring-[#111] font-extrabold" : "opacity-80";

        return `
          <button onclick="researcherJumpToStep(${idx})" 
                  class="h-6 border-2 border-[#111] font-mono-wire text-[11px] flex items-center justify-center gap-0.5 transition ${bgClass} ${ringClass}"
                  title="Step ${s.stepNumber}: ${s.shortTitle}">
            <span>${s.stepNumber}</span><span>${statusSymbol}</span>
          </button>
        `;
      }).join("");
    }

    /* =========================================================================
       7. MAIN STAGE & BOTTOM BAR RENDERER (4 CORE STATES + SUMMARY)
       ========================================================================= */
    function renderCurrentState() {
      renderHeaderAndProgress();
      const stage = document.getElementById("mainStage");
      const footer = document.getElementById("bottomActionBar");
      const step = STEPS_DATA[appState.currentStepIndex];

      if (appState.currentState === "A") {
        renderStateA(stage, footer, step);
      } else if (appState.currentState === "B") {
        renderStateB(stage, footer, step);
      } else if (appState.currentState === "C") {
        renderStateC(stage, footer, step);
      } else if (appState.currentState === "D") {
        renderStateD(stage, footer, step);
      } else if (appState.currentState === "DONE") {
        renderStateDone(stage, footer);
      }
    }

      stage.innerHTML = `

              </span>
            </div>
            <p class="text-base md:text-lg font-bold text-[#111] leading-snug pt-1">
              ${step.criticalCue}
            </p>

          <!-- Verification Gate Status Strip -->
          <div class="wire-box-flat p-3 bg-[#eaeae4] flex flex-wrap items-center justify-between gap-2">
            <span class="font-mono-wire text-xs font-bold uppercase">
              STEP ${step.stepNumber} VERIFICATION GATE STATUS:
            </span>
            <div class="flex flex-wrap items-center gap-2">
              ${subChecksHtml}
            </div>
          </div>
        </div>

      // Bottom Ergonomic Action Bar
      footer.innerHTML = `
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full">
          <button onclick="goToStateB()" class="wire-btn px-5 py-3 text-lg md:text-xl gap-3">

    /* -------------------------------------------------------------------------
       STATE C: SEQUENTIAL MULTI-QUESTION VERIFICATION QUIZ VIEW
       ------------------------------------------------------------------------- */
    function renderStateC(stage, footer, step) {
      const qIdx = appState.currentQuestionIndex;
      const qObj = step.questions[qIdx];
      const qStatus = appState.questionStatus[qObj.id];

      // Question Tabs (if step has 2 questions)
      const questionTabsHtml = step.questions.map((q, idx) => {
        const st = appState.questionStatus[q.id];
        const isActive = idx === qIdx;
        let stateTag = "[ ]";
        if (st === "VERIFIED") stateTag = "[OK]";
        if (st === "FAILED") stateTag = "[REVIEW]";

        return `
          <button onclick="goToStateC(${idx})" 
                  class="px-3 py-1.5 border-2 border-[#111] font-mono-wire text-xs font-bold transition ${isActive ? 'bg-[#111] text-[#f6f6f2]' : 'bg-white text-[#111] opacity-80'}">

          : "bg-[#f6f6f2] text-[#111111]";

        return `
          <button onclick="handleQuizOptionSelect(${idx})" 
                  class="wire-btn w-full p-3.5 md:p-4 gap-3.5 justify-start ${cardStyle}">
            <span class="font-mono-wire text-lg font-extrabold border-2 border-current w-9 h-9 flex items-center justify-center shrink-0">

            <span class="text-base md:text-lg font-bold leading-snug text-left flex-1">
              ${opt.text}
            </span>

      stage.innerHTML = `

          <!-- Confirmation Banner when Verified -->
          ${qStatus === "VERIFIED" ? `
            <div class="wire-box-flat bg-[#111] text-[#f6f6f2] px-4 py-2.5 flex items-center justify-between">
              <span class="font-mono-wire text-sm font-extrabold uppercase">
                OK ${qObj.id} VERIFIED - OPTIMAL PHYSICAL STATE CONFIRMED
              </span>
              <span class="font-mono-wire text-xs opacity-80">Gate Unlocked</span>
            </div>
          ` : ""}

          <!-- Stacked Ergonomic Option Cards -->
          <div class="flex flex-col gap-2.5">
            ${optionsCardsHtml}
          </div>
        </div>
      `;

      // Determine Footer Navigation Buttons in State C
      let rightCtaHtml = "";
      if (stepFullyVerified) {
        const nextLabel = appState.currentStepIndex < 9
          ? `Proceed to Step ${step.stepNumber + 1}: ${STEPS_DATA[appState.currentStepIndex + 1].shortTitle}`
          : `Complete Procedure & View Summary`;
        rightCtaHtml = `
          <button onclick="advanceToNextStep()" class="wire-btn wire-btn-primary px-5 py-3 text-base md:text-lg gap-3 justify-center">
            <span class="font-mono-wire text-xl font-extrabold">→</span>
            <span class="font-extrabold truncate">${nextLabel}</span>
          </button>
        `;
      } else if (qStatus === "VERIFIED" && step.questions.length > 1) {
        const nextUnverifiedIdx = getFirstUnverifiedQuestionIndex(appState.currentStepIndex);
        rightCtaHtml = `
          <button onclick="goToStateC(${nextUnverifiedIdx})" class="wire-btn wire-btn-primary px-5 py-3 text-base md:text-lg gap-3 justify-center">

            <span class="font-extrabold">Continue to ${step.questions[nextUnverifiedIdx].label}</span>
          </button>

    /* =========================================================================
       8. SIMULATED LO-FI WIREFRAME VIDEO PLAYER & SCHEMATIC CANVAS ANIMATOR
       ========================================================================= */
    function startVideoLoop() {
      const shouldPlayOnStart = appState.video.isPlaying;
      stopVideoLoop();
      appState.video.isPlaying = shouldPlayOnStart;
      appState.video.lastTick = performance.now();
      function tick(now) {
        if (appState.currentState !== "B") return;
        const dt = (now - appState.video.lastTick) / 1000;
        appState.video.lastTick = now;

        if (appState.video.isPlaying) {
          appState.video.currentTime += dt;
          if (appState.video.currentTime >= appState.video.duration) {
            appState.video.currentTime = appState.video.duration;
            appState.video.isPlaying = false;
            updateVideoControlsUI();
          }
          updateVideoScrubberUI();
        }
        drawWireframeVideoSchematic();
        appState.video.rafId = requestAnimationFrame(tick);
      }
      appState.video.rafId = requestAnimationFrame(tick);
    }

    function stopVideoLoop() {
      if (appState.video.rafId) {
        cancelAnimationFrame(appState.video.rafId);
        appState.video.rafId = null;
      }
      appState.video.isPlaying = false;
    }

    function toggleVideoPlayPause() {
      if (appState.video.currentTime >= appState.video.duration) {
        appState.video.currentTime = 0;
      }
      appState.video.isPlaying = !appState.video.isPlaying;
      logEvent(appState.video.isPlaying ? "VIDEO_PLAY" : "VIDEO_PAUSE", `Timecode ${appState.video.currentTime.toFixed(1)}s`);
      updateVideoControlsUI();
    }

    function skipVideoBackward5s() {
      appState.video.currentTime = Math.max(0, appState.video.currentTime - 5);
      logEvent("VIDEO_SKIP_BACK_5S", `New timecode ${appState.video.currentTime.toFixed(1)}s`);
      updateVideoScrubberUI();
      drawWireframeVideoSchematic();
    }

    function rewatchVideoFromStart() {
      appState.video.currentTime = 0;
      appState.video.isPlaying = true;
      logEvent("VIDEO_REWATCH", "Restarted demo video from 00:00");
      updateVideoControlsUI();
      updateVideoScrubberUI();
    }

    function scrubVideoTo(val) {
      appState.video.currentTime = parseFloat(val);
      logEvent("VIDEO_SCRUB", `Scrubbed to ${appState.video.currentTime.toFixed(1)}s`);
      updateVideoScrubberUI();
      drawWireframeVideoSchematic();
    }

    function updateVideoControlsUI() {
      const iconEl = document.getElementById("btnPlayPauseIcon");
      const labelEl = document.getElementById("btnPlayPauseLabel");
      if (iconEl) iconEl.textContent = appState.video.isPlaying ? "PAUSE" : "PLAY";
      if (labelEl) labelEl.textContent = appState.video.isPlaying ? "Pause" : "Play";
    }

    function fitDemoFocusTextToSingleLine() {
      const el = document.getElementById("demoFocusText");
      if (!el) return;

      let sizePx = 11;
      el.style.fontSize = `${sizePx}px`;
      el.style.whiteSpace = "nowrap";

      while (sizePx > 8 && el.scrollWidth > el.clientWidth) {
        sizePx -= 0.5;
        el.style.fontSize = `${sizePx}px`;
      }
    }

    function updateVideoScrubberUI() {
      const scrubber = document.getElementById("videoScrubberInput");
      if (scrubber) scrubber.value = appState.video.currentTime;
      const badge = document.getElementById("videoTimecodeBadge");
      if (badge) {
        const cur = Math.floor(appState.video.currentTime).toString().padStart(2, "0");
        badge.textContent = `00:${cur} / 00:15`;
      }
    }

    function resizeAndDrawVideoCanvas() {
      const canvas = document.getElementById("demoVideoCanvas");
      if (!canvas) return;
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = Math.max(200, rect.height - 46);
      drawWireframeVideoSchematic();
    }

    /* Renders a distinct lo-fi procedural schematic animation for each of the 10 steps */
    function drawWireframeVideoSchematic() {
      const canvas = document.getElementById("demoVideoCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;
      const t = appState.video.currentTime / appState.video.duration; // 0..1 normalized progress
      const stepNum = appState.currentStepIndex + 1;

      ctx.clearRect(0, 0, w, h);

      // Background blueprint grid
      ctx.strokeStyle = "#e2e2dc";
      ctx.lineWidth = 1;
      for (let x = 0; x < w; x += 24) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      }
      for (let y = 0; y < h; y += 24) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }

      // Top-left wireframe camera HUD tag
      ctx.fillStyle = "#111111";
      ctx.font = "bold 12px monospace";
      ctx.fillText(`[WIREFRAME SIMULATOR FEED — STEP ${stepNum} ANIMATION]`, 16, 24);

      const cx = w / 2;
      const cy = h / 2;

      ctx.save();
      ctx.strokeStyle = "#111111";
      ctx.fillStyle = "#111111";
      ctx.lineWidth = 2.5;

      // Helper to draw cross-section ribs and pleural line
      function drawRibsAndPleura() {
        // Pleural line
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(cx - 180, cy + 28);
        ctx.lineTo(cx + 180, cy + 28);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.font = "bold 11px monospace";
        ctx.fillText("PARIETAL PLEURA", cx + 95, cy + 44);

        // Two ribs in cross-section
        // Rib 4 (Overlying rib with neurovascular bundle on inferior groove)
        ctx.fillStyle = "#dcdcd4";
        ctx.beginPath();
        ctx.ellipse(cx - 85, cy - 10, 32, 20, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#111";
        ctx.fillText("RIB 4", cx - 103, cy - 6);
        // Neurovascular bundle dot at lower edge of Rib 4
        ctx.beginPath();
        ctx.arc(cx - 85, cy + 12, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillText("NV Bundle (Avoid)", cx - 145, cy + 24);

        // Rib 5 (Target upper edge)
        ctx.fillStyle = "#dcdcd4";
        ctx.beginPath();
        ctx.ellipse(cx + 65, cy - 10, 34, 22, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#111";
        ctx.fillText("RIB 5 (Upper Edge ↑)", cx + 30, cy - 38);
      }

      if (stepNum === 1) {
        // Step 1: Trocar pulled out + Forceps clamped 1 cm behind tip
        const tubeY = cy - 10;
        // Chest tube outline
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(cx - 140, tubeY - 12, 240, 24);
        ctx.strokeRect(cx - 140, tubeY - 12, 240, 24);
        // Side holes
        ctx.fillStyle = "#111";
        ctx.fillRect(cx - 115, tubeY - 5, 12, 10);
        ctx.fillRect(cx - 80, tubeY - 5, 12, 10);

        // Trocar sliding out to the right during first half (t: 0 -> 0.5)
        const trocarOffset = Math.min(1, t * 2) * 140;
        ctx.save();
        ctx.globalAlpha = Math.max(0.15, 1 - t * 1.4);
        ctx.fillStyle = "#555";
        ctx.fillRect(cx - 120 + trocarOffset, tubeY - 4, 230, 8);
        ctx.fillText("1. Pull Out Obsolete Trocar →", cx + 20, tubeY - 24);
        ctx.restore();

        // Kornzange clamping 1 cm behind tip in second half (t: 0.4 -> 1.0)
        const clampProgress = Math.max(0, Math.min(1, (t - 0.35) / 0.5));
        const clampY = tubeY + 65 - clampProgress * 55;
        ctx.strokeStyle = "#111";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx - 118, clampY);
        ctx.lineTo(cx - 118, clampY - 22);
        ctx.moveTo(cx - 110, clampY);
        ctx.lineTo(cx - 110, clampY - 22);
        ctx.stroke();

        // 1 cm protruding tip callout
        ctx.fillStyle = "#111";
        ctx.fillText("← 1 cm Soft Tip Protruding", cx - 265, tubeY + 4);
        ctx.fillText("2. Clamp Forceps Flush 1 cm Behind Tip", cx - 150, tubeY + 68);
      } else if (stepNum === 2) {
        // Step 2: Triangle of Safety & 4-5 cm incision parallel to rib
        ctx.strokeRect(cx - 150, cy - 65, 300, 130);
        ctx.beginPath();
        ctx.moveTo(cx - 60, cy - 65);
        ctx.lineTo(cx - 110, cy + 65);
        ctx.moveTo(cx - 60, cy - 65);
        ctx.lineTo(cx + 70, cy + 65);
        ctx.stroke();
        ctx.fillText("Pectoralis Major", cx - 140, cy - 45);
        ctx.fillText("Latissimus Dorsi", cx + 35, cy - 45);
        ctx.fillText("4th/5th ICS (1 Hand-Width Below Axilla)", cx - 115, cy + 55);

        // Animated 4-5 cm incision line
        const incLen = Math.min(1, t * 1.3) * 90;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(cx - 50, cy + 10);
        ctx.lineTo(cx - 50 + incLen, cy - 8);
        ctx.stroke();
        ctx.fillText("4–5 cm Incision (Cutis & Subcutis Only)", cx - 80, cy - 20);
      } else if (stepNum === 3) {
        // Step 3: Cranially curved Metzenbaum gliding from mid-rib to upper edge
        drawRibsAndPleura();
        const glideT = Math.min(1, t * 1.25);
        const tipX = cx + 65 - glideT * 28;
        const tipY = cy - 12 - glideT * 14;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(cx + 120, cy - 75);
        ctx.quadraticCurveTo(tipX + 20, tipY + 15, tipX, tipY);
        ctx.stroke();
        ctx.fillText("Closed Curved Scissors (Convexity Cranial) → Upper Rib Edge", cx - 150, cy - 60);
      } else if (stepNum === 4) {
        // Step 4: Bimanual depth-stop perforation
        drawRibsAndPleura();
        const depthT = Math.min(1, t * 1.3);
        const tipY = cy - 18 + depthT * 56;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(cx + 35, cy - 75);
        ctx.lineTo(cx + 25, tipY);
        ctx.stroke();

        // Non-dominant hand depth guard block at skin surface
        ctx.fillStyle = "#111";
        ctx.fillRect(cx - 10, cy - 45, 70, 14);
        ctx.fillStyle = "#fff";
        ctx.fillText("DEPTH STOP HAND", cx - 6, cy - 35);
        ctx.fillStyle = "#111";
        if (depthT >= 0.85) {
          ctx.fillText("LOSS OF RESISTANCE (STOP)", cx - 160, cy + 58);
        }
      } else if (stepNum === 5) {
        // Step 5: Spread Metzenbaum scissors at least 1 finger width
        drawRibsAndPleura();
        const spread = Math.min(1, t * 1.3) * 26;
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(cx, cy - 65);
        ctx.lineTo(cx - spread, cy + 45);
        ctx.moveTo(cx, cy - 65);
        ctx.lineTo(cx + spread, cy + 45);
        ctx.stroke();
        ctx.fillText("Spread ≥ 1 Finger Width (Perpendicular Posture)", cx - 140, cy - 70);
      } else if (stepNum === 6) {
        // Step 6: Opposing-motion swap (Open scissors out, index finger in)
        drawRibsAndPleura();
        const swapT = Math.min(1, t * 1.2);
        // Scissors moving up
        const scisY = cy + 35 - swapT * 75;
        ctx.strokeRect(cx - 28, scisY - 30, 22, 40);
        ctx.fillText("↑ Open Scissors Out", cx - 150, cy - 45);
        // Finger moving down simultaneously
        const fingY = cy - 50 + swapT * 90;
        ctx.fillStyle = "#dcdcd4";
        ctx.fillRect(cx + 4, fingY - 45, 22, 65);
        ctx.strokeRect(cx + 4, fingY - 45, 22, 65);
        ctx.fillStyle = "#111";
        ctx.fillText("↓ Index Finger In (Opposing Motion)", cx + 34, cy - 45);
      } else if (stepNum === 7) {
        // Step 7: 360 degree intrapleural sweep, finger stays parked
        drawRibsAndPleura();
        const angle = t * Math.PI * 2;
        ctx.fillStyle = "#dcdcd4";
        ctx.fillRect(cx - 10, cy - 45, 22, 85);
        ctx.strokeRect(cx - 10, cy - 45, 22, 85);
        ctx.beginPath();
        ctx.arc(cx, cy + 45, 36, 0, angle);
        ctx.stroke();
        ctx.fillStyle = "#111";
        ctx.fillText("360° Sweep Inside Pleura — Finger Remains Parked", cx - 145, cy - 60);
      } else if (stepNum === 8) {
        // Step 8: 1 cm drain tip contacts fingertip, then rotate & open forceps
        drawRibsAndPleura();
        // Parked finger at opening
        ctx.fillStyle = "#dcdcd4";
        ctx.fillRect(cx - 25, cy - 25, 20, 62);
        ctx.strokeRect(cx - 25, cy - 25, 20, 62);
        // Clamped drain meeting fingertip
        const advanceT = Math.min(1, t * 1.5);
        const drainX = cx + 80 - advanceT * 75;
        ctx.fillStyle = "#fff";
        ctx.fillRect(drainX, cy + 12, 95, 16);
        ctx.strokeRect(drainX, cy + 12, 95, 16);
        ctx.fillStyle = "#111";
        ctx.fillText("1 cm Drain Tip Touches Fingertip → Align → Unclamp", cx - 155, cy - 60);
      } else if (stepNum === 9) {
        // Step 9: Withdraw open forceps, advance drain until sentinel side-hole is intrathoracic
        drawRibsAndPleura();
        const adv = Math.min(1, t * 1.3) * 95;
        ctx.fillStyle = "#fff";
        ctx.fillRect(cx - 20 - adv, cy + 32, 180, 16);
        ctx.strokeRect(cx - 20 - adv, cy + 32, 180, 16);
        // Sentinel eye marker
        ctx.fillStyle = "#111";
        ctx.fillRect(cx + 85 - adv, cy + 36, 10, 8);
        ctx.fillText("All Side Holes Intrathoracic (Over Guiding Finger)", cx - 145, cy - 60);
      } else if (stepNum === 10) {
        // Step 10: Fogging check, withdraw finger while stabilizing tube, clamp tube
        drawRibsAndPleura();
        ctx.fillStyle = "#fff";
        ctx.fillRect(cx - 90, cy - 20, 180, 18);
        ctx.strokeRect(cx - 90, cy - 20, 180, 18);
        // Fogging waves inside tube
        ctx.fillStyle = "#bbb";
        const fogW = (Math.sin(t * 14) + 1) * 35 + 20;
        ctx.fillRect(cx - 40, cy - 16, fogW, 10);
        // Clamp at distal end
        ctx.fillStyle = "#111";
        ctx.fillRect(cx + 65, cy - 32, 12, 42);
